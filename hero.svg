<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="FootWars gameplay scene">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0f1f3a"/>
      <stop offset="1" stop-color="#16304f"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#3b2412"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H10M0 0V10" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="520" rx="28"/></clipPath>
    <path id="arc" d="M330 300 C 470 40, 720 40, 905 345" fill="none"/>
  </defs>

  <g clip-path="url(#frame)">
    <!-- gökyüzü -->
    <rect width="1200" height="520" fill="url(#sky)"/>

    <!-- tribün silueti -->
    <g fill="#0b1830">
      <path d="M0 250 L0 340 L1200 340 L1200 250 Z"/>
    </g>
    <g fill="#132547">
      <rect x="0" y="262" width="1200" height="12"/>
      <rect x="0" y="286" width="1200" height="12"/>
      <rect x="0" y="310" width="1200" height="12"/>
    </g>
    <g fill="#1e3a66" opacity="0.6">
      <g id="crowd">
        <circle cx="12" cy="258" r="4"/><circle cx="28" cy="258" r="4"/><circle cx="44" cy="258" r="4"/><circle cx="60" cy="258" r="4"/>
        <circle cx="20" cy="282" r="4"/><circle cx="36" cy="282" r="4"/><circle cx="52" cy="282" r="4"/>
        <circle cx="12" cy="306" r="4"/><circle cx="28" cy="306" r="4"/><circle cx="44" cy="306" r="4"/><circle cx="60" cy="306" r="4"/>
      </g>
      <use href="#crowd" x="72"/><use href="#crowd" x="144"/><use href="#crowd" x="216"/><use href="#crowd" x="288"/>
      <use href="#crowd" x="360"/><use href="#crowd" x="432"/><use href="#crowd" x="504"/><use href="#crowd" x="576"/>
      <use href="#crowd" x="648"/><use href="#crowd" x="720"/><use href="#crowd" x="792"/><use href="#crowd" x="864"/>
      <use href="#crowd" x="936"/><use href="#crowd" x="1008"/><use href="#crowd" x="1080"/><use href="#crowd" x="1152"/>
    </g>

    <!-- projektörler -->
    <g>
      <path d="M150 0 L60 250 L300 250 Z" fill="url(#glowL)"/>
      <path d="M1050 0 L900 250 L1140 250 Z" fill="url(#glowL)"/>
      <rect x="146" y="0" width="8" height="250" fill="#1f2d4a"/>
      <rect x="1046" y="0" width="8" height="250" fill="#1f2d4a"/>
      <rect x="120" y="4" width="60" height="18" rx="4" fill="#cbd5e1"/>
      <rect x="1020" y="4" width="60" height="18" rx="4" fill="#cbd5e1"/>
    </g>

    <!-- rüzgar -->
    <g transform="translate(600 56)" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M-70 0 H40"/>
      <path d="M22 -14 L40 0 L22 14"/>
      <path d="M-70 -22 H10" opacity="0.5"/>
      <path d="M-70 22 H10" opacity="0.5"/>
    </g>

    <!-- zemin -->
    <path d="M0 400 L120 400 L200 395 L300 372 L400 352 L500 330 L600 318 L700 330 L780 350 L830 372 L852 380 Q 880 430 912 380 L940 378 L1000 392 L1100 400 L1200 400 L1200 520 L0 520 Z" fill="url(#dirt)"/>
    <!-- çim -->
    <path d="M0 400 L120 400 L200 395 L300 372 L400 352 L500 330 L600 318 L700 330 L780 350 L830 372 L852 380" fill="none" stroke="#4ade80" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M912 380 L940 378 L1000 392 L1100 400 L1200 400" fill="none" stroke="#4ade80" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- krater içi -->
    <path d="M852 380 Q 880 430 912 380" fill="none" stroke="#2a1a0c" stroke-width="10" stroke-linecap="round"/>
    <!-- toprak parçaları -->
    <g fill="#8a5a2b">
      <circle cx="845" cy="340" r="5"/><circle cx="925" cy="332" r="4"/><circle cx="880" cy="318" r="3.5"/><circle cx="905" cy="352" r="3"/>
    </g>

    <!-- sol kale -->
    <g transform="translate(60 400)">
      <rect x="0" y="-130" width="70" height="130" fill="url(#net)"/>
      <path d="M0 0 V-130 H70" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 -130 V-112" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- sağ kale -->
    <g transform="translate(1140 400) scale(-1 1)">
      <rect x="0" y="-130" width="70" height="130" fill="url(#net)"/>
      <path d="M0 0 V-130 H70" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 -130 V-112" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- yörünge -->
    <use href="#arc" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="2 16" stroke-linecap="round"/>

    <!-- mavi oyuncu (şut) -->
    <g transform="translate(300 372)">
      <!-- can barı -->
      <rect x="-40" y="-120" width="80" height="9" rx="4" fill="#000" fill-opacity="0.6"/>
      <rect x="-40" y="-120" width="66" height="9" rx="4" fill="#22c55e"/>
      <!-- gölge -->
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" fill-opacity="0.35"/>
      <!-- bacaklar -->
      <rect x="-20" y="-40" width="14" height="40" rx="5" fill="#f1c27d"/>
      <rect x="4" y="-44" width="14" height="30" rx="5" fill="#f1c27d" transform="rotate(-50 11 -44)"/>
      <!-- kramponlar -->
      <rect x="-24" y="-6" width="22" height="8" rx="3" fill="#111827"/>
      <rect x="24" y="-66" width="22" height="8" rx="3" fill="#111827" transform="rotate(-50 35 -62)"/>
      <!-- şort -->
      <rect x="-22" y="-56" width="44" height="20" rx="4" fill="#1e3a8a"/>
      <!-- forma -->
      <rect x="-24" y="-104" width="48" height="52" rx="8" fill="#3b82f6"/>
      <circle cx="0" cy="-78" r="8" fill="#93c5fd"/>
      <!-- kollar -->
      <rect x="-46" y="-100" width="14" height="40" rx="6" fill="#3b82f6" transform="rotate(30 -39 -100)"/>
      <rect x="32" y="-100" width="14" height="40" rx="6" fill="#3b82f6" transform="rotate(-40 39 -100)"/>
      <!-- kafa -->
      <circle cx="0" cy="-124" r="18" fill="#f1c27d"/>
      <path d="M-18 -130 Q 0 -150 18 -130 Z" fill="#1f2937"/>
      <circle cx="7" cy="-126" r="2.6" fill="#111827"/>
    </g>

    <!-- açı ve güç göstergesi -->
    <g transform="translate(330 300)" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
      <path d="M0 0 L70 -58" stroke-dasharray="8 8"/>
      <path d="M40 0 A40 40 0 0 0 31 -24" opacity="0.8"/>
    </g>
    <g transform="translate(240 250)">
      <rect x="0" y="0" width="120" height="12" rx="6" fill="#000" fill-opacity="0.6"/>
      <rect x="0" y="0" width="88" height="12" rx="6" fill="#fbbf24"/>
    </g>

    <!-- kırmızı oyuncu (geri sekiyor) -->
    <g transform="translate(905 345) rotate(14)">
      <rect x="-40" y="-128" width="80" height="9" rx="4" fill="#000" fill-opacity="0.6"/>
      <rect x="-40" y="-128" width="26" height="9" rx="4" fill="#ef4444"/>
      <rect x="-18" y="-40" width="14" height="40" rx="5" fill="#f1c27d" transform="rotate(20 -11 -40)"/>
      <rect x="6" y="-40" width="14" height="40" rx="5" fill="#f1c27d" transform="rotate(-25 13 -40)"/>
      <rect x="-24" y="-6" width="22" height="8" rx="3" fill="#111827" transform="rotate(20 -13 -2)"/>
      <rect x="6" y="-6" width="22" height="8" rx="3" fill="#111827" transform="rotate(-25 17 -2)"/>
      <rect x="-22" y="-56" width="44" height="20" rx="4" fill="#7f1d1d"/>
      <rect x="-24" y="-104" width="48" height="52" rx="8" fill="#ef4444"/>
      <circle cx="0" cy="-78" r="8" fill="#fecaca"/>
      <rect x="-50" y="-104" width="14" height="40" rx="6" fill="#ef4444" transform="rotate(60 -43 -104)"/>
      <rect x="36" y="-104" width="14" height="40" rx="6" fill="#ef4444" transform="rotate(-70 43 -104)"/>
      <circle cx="0" cy="-124" r="18" fill="#f1c27d"/>
      <path d="M-18 -130 Q 0 -150 18 -130 Z" fill="#7c2d12"/>
      <path d="M-9 -126 L-3 -122 M-9 -122 L-3 -126" stroke="#111827" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- patlama -->
    <g transform="translate(882 352)">
      <circle r="70" fill="url(#boom)">
        <animate attributeName="r" values="58;74;58" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.95;0.7;0.95" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -62 L12 -22 L54 -34 L24 -4 L62 20 L20 18 L26 62 L0 28 L-26 62 L-20 18 L-62 20 L-24 -4 L-54 -34 L-12 -22 Z" fill="#fde68a" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </path>
      <circle r="16" fill="#fff7cc"/>
    </g>

    <!-- top -->
    <g>
      <g>
        <circle r="17" fill="#f8fafc"/>
        <polygon points="0,-9 8,-3 5,7 -5,7 -8,-3" fill="#0b1220"/>
        <path d="M0 -9 L0 -16 M8 -3 L15 -6 M5 7 L9 14 M-5 7 L-9 14 M-8 -3 L-15 -6" stroke="#0b1220" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#arc"/>
      </animateMotion>
    </g>

    <!-- çerçeve -->
    <rect width="1200" height="520" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
